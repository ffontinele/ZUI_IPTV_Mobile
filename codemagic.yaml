workflows:
  android-debug:
    name: ZUI Android Debug
    max_build_duration: 45
    environment:
      node: 20
      java: 17
    scripts:
      - npm install
      - npm run build
      - npx cap sync android
      - cd android && chmod +x gradlew && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
