name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK to friendly name
        run: |
          ORIG="android/app/build/outputs/apk/debug/app-debug.apk"
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle || echo "dev")
          NEW_NAME="ZUI_IPTV_Mobile_v${VERSION}.apk"
          mkdir -p dist-apk
          cp "$ORIG" "dist-apk/$NEW_NAME"
          echo "NEW_APK=$NEW_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          ls -la dist-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZUI_IPTV_Mobile
          path: dist-apk/*.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ZUI IPTV Mobile — build ${{ github.run_number }} (v${{ env.VERSION }})
          body: |
            ## 📱 ZUI IPTV Mobile — build ${{ github.run_number }}
            
            **Versão interna:** `${{ env.VERSION }}`
            **Commit:** `${{ github.sha }}`
            
            ### 📦 Download
            - `${{ env.NEW_APK }}` (APK pronto pra instalar no celular)
            
            ### 🔧 Como instalar
            1. Baixe o APK abaixo
            2. No celular: Ativar "Fontes desconhecidas" nas configurações
            3. Instalar o APK
          files: dist-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
